[package]
name = "pardosa-derive"
version = "0.5.3"
edition = "2021"
description = "Procedural macro deriving PardosaSchema AST descriptors and codecs for Pardosa"
license = "MIT OR Apache-2.0"
repository = "https://github.com/acje/pardosa"
documentation = "https://docs.rs/pardosa-derive"
rust-version = "1.89.0"
keywords = ["pardosa", "derive", "schema", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
