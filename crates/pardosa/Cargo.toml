[package]
name = "pardosa"
version = "0.5.4"
edition = "2021"
description = "Deterministic append-only event store foundation with schema descriptors, codecs, container formats, and fiber lifecycle management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/acje/pardosa"
documentation = "https://docs.rs/pardosa"
rust-version = "1.89.0"
keywords = ["event-store", "eventsourcing", "storage", "schema", "linearizable"]
categories = ["database-implementations", "data-structures"]

[dependencies]
pardosa-derive = { version = "0.5.4", path = "../pardosa-derive" }
crc32c = "0.6"
blake3 = "1.5"
uuid = { version = "1.10", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
pardosa-nats = { version = "0.5.4", path = "../pardosa-nats", features = ["unstable-test-support"] }
tempfile = "3"

[features]
default = ["uuid"]
uuid = ["dep:uuid"]
nats = []
unstable-test-support = []
