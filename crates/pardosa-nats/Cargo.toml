[package]
name = "pardosa-nats"
version = "0.5.3"
edition = "2021"
description = "NATS JetStream storage adapter for Pardosa"
license = "MIT OR Apache-2.0"
repository = "https://github.com/acje/pardosa"
documentation = "https://docs.rs/pardosa-nats"
rust-version = "1.89.0"
keywords = ["pardosa", "nats", "jetstream", "storage", "event-store"]
categories = ["database-implementations", "asynchronous"]

[dependencies]
pardosa = { version = "0.5.3", path = "../pardosa" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net"] }
async-nats = "0.49"
bytes = "1"
blake3 = "1.5"
crc32c = "0.6"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
hex = "0.4"
serde_json = "1"

[features]
default = []
unstable-test-support = []
