[package]
name = "pardosa-nats"
version = "0.1.0"
edition = "2021"
description = "NATS JetStream storage adapter for Pardosa"
license = "MIT OR Apache-2.0"

[dependencies]
pardosa = { path = "../pardosa" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net"] }
async-nats = "0.49"
bytes = "1"
blake3 = "1.5"
crc32c = "0.6"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
hex = "0.4"
serde_json = "1"

[features]
default = []
unstable-test-support = []
