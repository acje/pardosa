name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Producer-native CI caller: reuse the repo's single canonical verification
# entrypoint (scripts/verify.sh) with a non-skipped live-NATS prerequisite.
# No gate is removed or reimplemented here; provisioning mirrors the reviewed
# gh-report CI mechanism (gh-report .github/workflows/ci-reusable.yml):
#   - nats-server pinned by tools/.nats-server-version, checksum-verified
#     against the upstream SHA256SUMS before install, and hard-verified on
#     PATH before the entrypoint runs so a missing or wrong server cannot
#     silently pass.
#   - comment-free installed at the canonical reviewed revision.
# Third-party actions are pinned by full commit SHA (immutable refs), not
# floating tags; the trailing `# v<tag>` is human-readable provenance only.

jobs:
  verify:
    name: native verify.sh with pinned live NATS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: provision 1.98 toolchain for canonical tool build
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.98.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: install canonical comment-free
        run: cargo +1.98.0 install --git https://github.com/acje/comment-free --rev b4666626bbeee4e74ca41fd6ff1048b2f167dd27 --locked comment-free
      - name: bounded-source rustdoc budget
        run: comment-free --check-doc-budget --doc-advisory-words 80 --doc-max-words 120 --max-warning-files 0 .
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cache nats-server binary
        id: cache-nats-server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/nats-server
          key: nats-server-${{ runner.os }}-${{ hashFiles('tools/.nats-server-version') }}
      - name: install pinned nats-server
        if: steps.cache-nats-server.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < tools/.nats-server-version)"
          asset="nats-server-v${version}-linux-amd64"
          base="https://github.com/nats-io/nats-server/releases/download/v${version}"
          curl -fsSL -o "${asset}.tar.gz" "${base}/${asset}.tar.gz"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          awk -v a="${asset}.tar.gz" '$NF == a { print }' SHA256SUMS | sha256sum -c -
          tar -xzf "${asset}.tar.gz"
          install -m 0755 "${asset}/nats-server" /usr/local/bin/nats-server
      - name: verify nats-server on PATH matches pin exactly
        run: |
          version="$(tr -d '[:space:]' < tools/.nats-server-version)"
          reported="$(nats-server --version 2>&1 | sed -n 's/.*[vV]\([^[:space:]]*\).*/\1/p' | head -n 1)"
          case "$reported" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected nats-server version string '$reported'" >&2; exit 1 ;;
          esac
          if [ "$reported" != "$version" ]; then
            echo "::error::nats-server version '$reported' does not match pin '$version'" >&2
            exit 1
          fi
      - name: native verification entrypoint
        run: sh scripts/verify.sh
