[package]
name = "pardosa"
version = "0.1.0"
edition = "2021"
description = "EDA storage layer implementing fiber semantics"
license = "MIT"

[lib]
name = "pardosa"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
