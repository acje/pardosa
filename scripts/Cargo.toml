[package]
name = "scripts"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

